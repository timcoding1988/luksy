name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor:
    name: Verify vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go mod vendor && git diff --exit-code vendor/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: make

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Run unit tests (native arch)
        run: go test -timeout 45m -v -cover
      - name: Run unit tests (386)
        run: GOARCH=386 go test -timeout 45m -v -cover

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bats cryptsetup
      - name: Build binary
        run: make
      - name: Defaults tests
        run: bats -f defaults ./tests
      - name: AES tests
        run: bats -f aes ./tests
